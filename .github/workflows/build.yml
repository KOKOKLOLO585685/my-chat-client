name: Build Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install flet flet-cli -r requirements.txt
      - name: Build APK
        run: flet build apk --yes --project "ChatApp" --product "ChatApp"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/apk/*.apk

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install flet flet-cli -r requirements.txt
      - name: Build Windows
        run: flet build windows --yes --project "ChatApp" --product "ChatApp"
      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: build/windows/
